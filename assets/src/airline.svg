<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Airline Booking System - microservices</title><desc id="d">An airline booking backend split into five services, each owning its models and migrations. Email is asynchronous via RabbitMQ, so a booking never waits on it. RabbitMQ, MySQL, Sequelize, API gateway, JWT. Public source.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern><radialGradient id="glow"><stop stop-color="#FB923C" stop-opacity=".12"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/></radialGradient></defs><style>.sans{font-family:"Geist",sans-serif}.mono{font-family:"Geist Mono",monospace}.led{animation:blink 2s infinite}@keyframes blink{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="300" rx="20" fill="#121211"/><rect width="1200" height="300" fill="url(#dots)"/><rect width="1200" height="300" fill="url(#glow)"/><rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="#2A2A27"/><g stroke="#FB923C" stroke-opacity=".5" fill="none"><path d="M20 38V20h18M1162 20h18v18M1180 262v18h-18M38 280H20v-18"/></g><text x="56" y="62" class="mono" font-size="13" fill="#57534E">03 / 04 <tspan fill="#FB923C">MICROSERVICES</tspan></text><text x="56" y="124" class="sans" font-size="46" font-weight="600" fill="#FAFAF9">Airline Booking System</text><text x="56" y="164" class="sans" font-size="19" fill="#A8A29E">An airline booking backend split into five services, so a slow</text><text x="56" y="192" class="sans" font-size="19" fill="#A8A29E">email server never slows down a booking.</text><text x="56" y="241" class="mono" font-size="12" fill="#D6D3D1">RABBITMQ · MYSQL · SEQUELIZE · API GATEWAY · JWT</text><rect x="760" y="92" width="184" height="112" rx="12" fill="#171716" stroke="#2A2A27"/><text x="780" y="116" class="mono" font-size="10" fill="#57534E">ARCHITECTURE</text><text x="780" y="152"><tspan class="mono" font-size="34" fill="#FB923C">5</tspan><tspan class="sans" font-size="16" fill="#E7E5E4"> services</tspan></text><text x="780" y="176" class="sans" font-size="13" fill="#78716C">each owns its models</text><text x="780" y="193" class="sans" font-size="13" fill="#78716C">and migrations</text><rect x="960" y="92" width="184" height="112" rx="12" fill="#171716" stroke="#2A2A27"/><text x="980" y="116" class="mono" font-size="10" fill="#57534E">EMAIL PATH</text><text x="980" y="152" class="mono" font-size="34" fill="#FB923C">async</text><text x="980" y="176" class="sans" font-size="13" fill="#78716C">a booking never</text><text x="980" y="193" class="sans" font-size="13" fill="#78716C">waits on email</text><text x="1144" y="258" class="mono" font-size="12" fill="#FB923C" text-anchor="end">VIEW SOURCE →</text></svg>