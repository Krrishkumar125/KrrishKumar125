<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Krrish Kumar — Backend &amp; AI Engineer</title>
  <desc id="d">I build the systems behind intelligent products. Status: Parivar AI live, Ashvi Health building, RAG in progress. Open to backend and AI roles.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="87.5%" cy="45%" r="45%">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#3A3935" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3A3935"/>
      <stop offset="1" stop-color="#3A3935" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="term"><rect x="64" y="228" width="760" height="72" rx="12"/></clipPath>
  </defs>
  <style>
    .sans{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:4 6;animation:dash 1.1s linear infinite}
    .led{animation:led 2s ease-in-out infinite}
    .packet{animation:move 5s cubic-bezier(.6,0,.4,1) infinite}
    .type{animation:type 9s steps(60,end) infinite}
    .caret{animation:caret 1s step-end infinite}
    .spin1{transform-origin:1050px 190px;animation:spin 22s linear infinite}
    .spin2{transform-origin:1050px 190px;animation:spin 13s linear infinite reverse}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @keyframes led{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes move{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(800px);opacity:0}}
    @keyframes type{0%{transform:translateX(0)}45%,100%{transform:translateX(576px)}}
    @keyframes caret{50%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.cover{display:none}.packet{opacity:0}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#121211"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="#2A2A27"/>
  <g stroke="#FB923C" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M20 38 V20 H38"/><path d="M1162 20 H1180 V38"/><path d="M1180 382 V400 H1162"/><path d="M38 400 H20 V382"/>
  </g>
  <!-- HUD row -->
  <text x="64" y="60" class="mono" font-size="13" letter-spacing="2"><tspan fill="#E7E5E4">KRRISH.KUMAR</tspan><tspan fill="#57534E"> / SYSTEM.MAP</tspan></text>
  <g transform="translate(876 38)">
    <rect width="260" height="32" rx="16" fill="#4ADE80" fill-opacity="0.07" stroke="#4ADE80" stroke-opacity="0.35"/>
    <circle cx="20" cy="16" r="4" fill="#4ADE80" class="led"/>
    <text x="34" y="20.5" class="mono" font-size="11" fill="#86EFAC" letter-spacing="1">OPEN TO BACKEND &amp; AI ROLES</text>
  </g>
  <rect x="40" y="86" width="1120" height="1" fill="url(#fade)"/>
  <!-- Identity -->
  <text x="64" y="156" class="sans" font-size="76" font-weight="600" fill="#FAFAF9" letter-spacing="-2.5">Krrish Kumar</text>
  <text x="64" y="202" class="sans" font-size="24"><tspan fill="#E7E5E4" font-weight="500">Backend &amp; AI Engineer</tspan><tspan fill="#A8A29E"> — I build the systems behind intelligent products.</tspan></text>
  <!-- Terminal -->
  <rect x="64" y="228" width="760" height="72" rx="12" fill="#171716" stroke="#2A2A27"/>
  <text x="88" y="256" class="mono" font-size="16"><tspan fill="#57534E">~ </tspan><tspan fill="#FB923C">$ </tspan><tspan fill="#E7E5E4">krrish --status</tspan></text>
  <text x="88" y="283" class="mono" font-size="16"><tspan fill="#A8A29E">parivar-ai:</tspan><tspan fill="#4ADE80"> live</tspan><tspan fill="#57534E"> · </tspan><tspan fill="#A8A29E">ashvi-health:</tspan><tspan fill="#FB923C"> building</tspan><tspan fill="#57534E"> · </tspan><tspan fill="#A8A29E">rag:</tspan><tspan fill="#E7E5E4"> in progress</tspan></text>
  <g clip-path="url(#term)">
    <g class="cover type">
      <rect x="88" y="265" width="740" height="26" fill="#171716"/>
      <rect x="88" y="269" width="9" height="18" fill="#FB923C" class="caret"/>
    </g>
  </g>
  <!-- Core -->
  <g fill="none" stroke="#2A2A27">
    <circle cx="1050" cy="190" r="74"/>
    <circle cx="1050" cy="190" r="50" stroke-dasharray="2 6"/>
    <circle cx="1050" cy="190" r="26"/>
  </g>
  <g class="spin1">
    <path d="M1050 116 A74 74 0 0 1 1124 190" fill="none" stroke="#FB923C" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="1124" cy="190" r="4" fill="#FB923C"/>
  </g>
  <g class="spin2"><circle cx="1050" cy="140" r="3" fill="#E7E5E4"/></g>
  <circle cx="1050" cy="190" r="14" fill="#FB923C" fill-opacity="0.15" class="led"/>
  <circle cx="1050" cy="190" r="6" fill="#FB923C"/>
  <!-- Request path -->
  <text x="64" y="330" class="mono" font-size="11" fill="#57534E" letter-spacing="2">REQUEST PATH</text>
  <path d="M200 362 H1000" stroke="#44403C" stroke-width="2" fill="none" class="flow"/>
  <circle cx="200" cy="362" r="5" fill="#FB923C" class="packet"/>
  <g class="mono" font-size="15" text-anchor="middle">
    <rect x="64" y="342" width="136" height="40" rx="10" fill="#171716" stroke="#2F2E2B"/>
    <text x="132" y="367" fill="#E7E5E4">client</text>
    <rect x="251" y="342" width="136" height="40" rx="10" fill="#171716" stroke="#2F2E2B"/>
    <text x="319" y="367" fill="#E7E5E4">gateway</text>
    <rect x="438" y="342" width="136" height="40" rx="10" fill="#171716" stroke="#2F2E2B"/>
    <text x="506" y="367" fill="#E7E5E4">services</text>
    <rect x="626" y="342" width="136" height="40" rx="10" fill="#171716" stroke="#2F2E2B"/>
    <text x="694" y="367" fill="#E7E5E4">redis</text>
    <rect x="813" y="342" width="136" height="40" rx="10" fill="#171716" stroke="#2F2E2B"/>
    <text x="881" y="367" fill="#E7E5E4">queue</text>
    <rect x="1000" y="342" width="136" height="40" rx="10" fill="#1F140C" stroke="#FB923C"/>
    <text x="1068" y="367" fill="#FB923C">llm</text>
  </g>
</svg>