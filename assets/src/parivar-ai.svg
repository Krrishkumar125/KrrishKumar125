<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Parivar AI - live on Google Play</title><desc id="d">An AI companion for Indian families: talk to Maa, Papa, or Dadi in Hindi, by chat or voice call. App and backend built by Krrish. Stack: Node.js, LLM APIs, text-to-speech, Flutter.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern><radialGradient id="glow"><stop stop-color="#FB923C" stop-opacity=".16"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/></radialGradient><clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath></defs><style>.sans{font-family:"Geist",sans-serif}.mono{font-family:"Geist Mono",monospace}.led,.dot{animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#card)"><rect width="1200" height="340" fill="#121211"/><rect width="1200" height="340" fill="url(#dots)"/><rect width="1200" height="340" fill="url(#glow)"/></g><rect x=".5" y=".5" width="1199" height="339" rx="19.5" fill="none" stroke="#FB923C" stroke-opacity=".35"/><g stroke="#FB923C" stroke-opacity=".6" fill="none"><path d="M20 38V20h18M1162 20h18v18M1180 302v18h-18M38 320H20v-18"/></g><text x="56" y="64" class="mono" font-size="13" letter-spacing="2" fill="#57534E">01 / 04 <tspan fill="#FB923C">LIVE PRODUCT · FOUNDER</tspan></text><text x="56" y="132" class="sans" font-size="54" font-weight="600" fill="#FAFAF9">Parivar AI</text><rect x="356" y="100" width="206" height="30" rx="15" fill="#4ADE80" fill-opacity=".07" stroke="#4ADE80" stroke-opacity=".35"/><circle cx="374" cy="115" r="4" fill="#4ADE80" class="led"/><text x="386" y="119.5" class="mono" font-size="11" fill="#86EFAC">LIVE ON GOOGLE PLAY</text><text x="56" y="172" class="sans" font-size="22" fill="#E7E5E4">AI companion for Indian families.</text><text x="56" y="208" class="sans" font-size="18" fill="#A8A29E">When you can't call home, talk to Maa, Papa, or Dadi in Hindi,</text><text x="56" y="234" class="sans" font-size="18" fill="#A8A29E">by chat or voice call. App and backend built by me.</text><text x="56" y="276" class="mono" font-size="12" fill="#D6D3D1">HINDI &amp; HINGLISH · VOICE CALLS · PHOTO REACTIONS</text><text x="56" y="316" class="mono" font-size="12" fill="#78716C">NODE.JS · LLM APIS · TEXT-TO-SPEECH · FLUTTER</text><rect x="760" y="36" width="384" height="252" rx="16" fill="#171716" stroke="#2A2A27"/><circle cx="792" cy="72" r="16" fill="#FB923C" fill-opacity=".15"/><text x="792" y="77" class="sans" font-size="14" font-weight="600" fill="#FB923C" text-anchor="middle">M</text><text x="818" y="68" class="sans" font-size="15" font-weight="600" fill="#FAFAF9">Maa</text><text x="818" y="86" class="mono" font-size="11" fill="#4ADE80">online</text><line x1="776" y1="100" x2="1128" y2="100" stroke="#2A2A27"/><rect x="858" y="114" width="270" height="34" rx="14" fill="#FB923C" fill-opacity=".14"/><text x="872" y="136" class="sans" font-size="14" fill="#FED7AA">Maa, aaj exam tha. Bahut tough tha.</text><rect x="776" y="158" width="244" height="34" rx="14" fill="#1F1F1D"/><text x="790" y="180" class="sans" font-size="14" fill="#E7E5E4">Arre beta! Khana khaya ki nahi?</text><rect x="776" y="200" width="208" height="34" rx="14" fill="#1F1F1D"/><text x="790" y="222" class="sans" font-size="14" fill="#E7E5E4">Tum bahut mehnat karte ho.</text><rect x="776" y="242" width="62" height="30" rx="15" fill="#1F1F1D"/><circle cx="793" cy="257" r="3.5" fill="#A8A29E" class="dot"/><circle cx="807" cy="257" r="3.5" fill="#A8A29E" class="dot"/><circle cx="821" cy="257" r="3.5" fill="#A8A29E" class="dot"/><text x="1144" y="316" class="mono" font-size="12" fill="#FB923C" text-anchor="end">VISIT PARIVARAI.IN →</text></svg>