name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#EA580C&color_dots=#EBEDF0,#FED7AA,#FDBA74,#FB923C,#C2410C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FB923C&color_dots=#1C1C1A,#431407,#7C2D12,#C2410C,#FB923C
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
